<body>
    <h1>Tworzenie nowego elementu HTML</h1>
</body>
<script>
    //Tworzenie nowego elementu paragraph
    let newElement = document.createElement("p");
    //Tworzenie nowego tekstu
    newElement.textContent = "To jest nowy element";
    //Dodanie elementu do body
    document.body.appendChild(newElement);
</script>
